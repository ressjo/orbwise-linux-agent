# Orbwise configuration – copy to ~/.config/orbwise/config.yaml (or run: orbwise init-config)
# Every value is optional; anything not set uses the built-in default. Commented lines (# key: value) show the
# default – remove the "#" to change them. Passwords and tokens stay empty here: enter your own, or use the
# environment variables named next to them (ORBWISE_…), which keeps secrets out of this file.

language: de             # de (Deutsch) | en (English) – assistant, speech recognition, voice and UI
host: 127.0.0.1          # keep it local only – Orbwise can run commands on your machine!
port: 8765
# allow_remote: false    # only with true Orbwise starts on another address – the dashboard has no login!
assistant_name: Jarvis
user_name: ""            # how Jarvis should address you, e.g. "Alex"
persona_extra: ""        # extra personality instructions, e.g. "Call me 'boss'."
# holiday_region: BW      # German state for regional public holidays (date_info), empty = nationwide only

llm:
  base_url: http://localhost:11434   # Ollama (always used for the memory embeddings, too)
  # ≥16 GB VRAM: qwen3:14b · 8–12 GB: qwen3:8b · little VRAM / CPU only: qwen3:4b
  model: qwen3:14b
  embed_model: bge-m3    # multilingual embeddings for the memory search
  temperature: 0.6
  num_ctx: 16384         # the model's context window
  think: false           # Qwen3 "thinking" by default (slower); the THINK button toggles it per request
  # keep_alive: 30m        # how long Ollama keeps the model in (V)RAM after the last request
  # request_timeout: 300   # seconds until a model request is given up

  # Optional: several model profiles. Switch by clicking the LLM pill or with `orbwise model <name>`.
  # Without profiles there is a single profile "standard" built from the values above.
  # active: bonsai
  # profiles:
  #   qwen:
  #     backend: ollama
  #     model: qwen3:8b
  #   bonsai:                          # e.g. Bonsai 2 27B via llama-server on an 8 GB AMD card
  #     label: Bonsai 27B
  #     backend: openai                # any OpenAI-compatible server (llama-server, vLLM, LM Studio …)
  #     base_url: http://127.0.0.1:8080/v1
  #     model: bonsai
  #     api_key: "<random-password>"   # make up a long random password – the same value as --api-key below
  #     num_ctx: 16384                 # optional – Orbwise reads the real size from the server
  #     embed_on_cpu: true             # run memory embeddings on the CPU (VRAM is scarce)
  #     unload_ollama: true            # unload Ollama models from VRAM first
  #     # temperature: 0.6 · think: false – also per profile; empty = the values of the llm block
  #     server:                        # Orbwise starts/stops the server itself
  #       command: ~/bonsai/scripts/start_llama_server.sh -np 1 --api-key <random-password>
  #       env:
  #         HSA_OVERRIDE_GFX_VERSION: "10.3.0"   # RX 6600/6650/6700 (gfx103x) → report as gfx1030
  #         BONSAI_CTX: "16384"          # context window; fall back to 8192 if the server runs out of VRAM
  #         BONSAI_KV4: "1"
  #         BONSAI_MMPROJ_CPU: "1"
  #       startup_timeout: 240
  #       # cwd: ~/bonsai            # working directory for the command
  #       # health_url: ""           # default: <base_url without /v1>/health

memory:
  dir: ~/.local/share/orbwise/memory
  # context_budget_tokens: 11000  # only to cap the prompt – default: automatic from the model's context window
  retrieval_top_k: 6
  # retrieval_min_similarity: 0.5  # only show memories at least this similar to the question (0 = always)
  # retrieval_max_tokens: 1500   # recalled memory snippets in the first question of a context epoch (later: ⅓, only new)
  # facts_max_tokens: 1200       # max. size of the permanent facts (profile) in the prompt
  # compact_idle: true           # if the context is almost at the compaction point after an answer, compress right away instead of before the next question
  summarize_idle_minutes: 15

voice:
  enabled: true
  # language: de           # speech recognition language – default: same as "language" above
  stt_model: small         # tiny | base | small | medium | large-v3 (bigger = more accurate, slower)
  stt_device: cpu          # cuda on NVIDIA (faster-whisper); AMD GPUs: stay on cpu
  stt_compute_type: int8   # int8 on CPU, float16 on CUDA
  # tts_voice: ~/.local/share/orbwise/voices/de_DE-thorsten-high.onnx   # default depends on "language"
                           # (easier: pick, download or upload voices in the VOICE menu of the dashboard)
  # tts_length_scale: 0.95 # speaking rate: < 1 faster, > 1 slower
  wakeword_model: hey_jarvis
  wakeword_threshold: 0.5
  silence_ms: 900          # this much silence ends a recording
  # max_record_seconds: 20 # a recording ends after this long at the latest
  # no_speech_timeout_seconds: 5   # stop listening if nothing is said after the wake word

tools:
  search_paths:
    - "~"                  # in YAML a bare ~ must be quoted
  nas_paths: []            # e.g. [/mnt/nas, /mnt/nas-media]
  privilege_cmd: dashboard  # dashboard = password field in the dashboard · pkexec = polkit dialog · sudo = NOPASSWD rule only
  # sudo_remember_minutes: 15  # remember the dashboard password this long (RAM only, never for Telegram/routines); 0 = always ask
  package_manager: auto    # auto | pacman (Arch, Manjaro, EndeavourOS) | apt (Debian, Ubuntu, Mint)
  aur_helper: auto         # auto | yay | paru | none (Arch only)
  shell_timeout: 120
  # update_timeout: 3600   # seconds for a full system update
  # max_output_chars: 6000 # command output passed to the model is cut to this length
  max_steps: 25            # max. model steps (tool rounds) per request; then a summary + "continue"
  disabled: []             # switch off tools or whole groups, e.g. [sysadmin, open_ports] – saves context
  brave_api_key: ""        # Brave Search API key (api-dashboard.search.brave.com) – official API, no bot blocking
                           # (or $ORBWISE_BRAVE_API_KEY). Empty = SearXNG below, else result pages are scraped (ddgs)
  search_fallback: false   # with a Brave key: fall back to scraping when the API fails (quota used up, …)?
  searxng_url: null        # only your OWN SearXNG instance (public ones block the JSON API)

trilium:                   # Trilium / TriliumNext notes
  url: ""                  # e.g. http://localhost:8080 – leave empty to disable
  token: ""                # Trilium → Options → ETAPI → create token (or $ORBWISE_TRILIUM_TOKEN)
  verify_ssl: true         # HTTPS with a self-signed certificate: false (or the path to your CA file)
  # timeout: 20
  # max_chars: 8000        # longest note text passed to the model

obsidian:                  # Obsidian notes – works directly on the vault folder, no plugin needed
  vault: ""                # e.g. ~/Obsidian/Notes – leave empty to disable
  inbox: Inbox             # folder inside the vault for new notes
  # max_chars: 8000        # longest note text passed to the model

paperless:                 # Paperless-ngx: search, ask and open documents (read-only)
  url: ""                  # e.g. http://nas.local:8000 – leave empty to disable
  token: ""                # Paperless → profile (top right) → API auth token (or $ORBWISE_PAPERLESS_TOKEN)
  verify_ssl: true
  # timeout: 30
  # max_chars: 5000        # longest document text passed to the model

homeassistant:             # Home Assistant: lights, switches, heating, covers, scenes, sensors
  url: ""                  # e.g. http://homeassistant.local:8123 – leave empty to disable
  token: ""                # profile → Security → Long-lived access tokens (or $ORBWISE_HA_TOKEN)
  verify_ssl: true
  # timeout: 15

portainer:                 # Docker containers and stacks via the Portainer API (list, update, start/stop, install)
  url: ""                  # e.g. https://nas.local:9443 – leave empty to disable
  token: ""                # Portainer → user menu (top right) → My account → Access tokens (or $ORBWISE_PORTAINER_TOKEN)
  # environment: ""        # name or ID if Portainer manages several Docker hosts (default: the first one that is up)
  verify_ssl: true         # Portainer's default certificate is self-signed: false (or the path to your CA file)
  # timeout: 60

image:                     # image mode (Qwen-Image-2.1 via stable-diffusion.cpp) – set up with: orbwise model add qwen-image
  # dir: ""                # program + models (default ~/orbwise-image)
  # output_dir: ""         # where images go (default ~/Bilder/Orbwise or ~/Pictures/Orbwise)
  # port: 7861
  steps: 20                # more = finer detail, slower
  # cfg_scale: 6.0
  # size: "1:1"            # 1:1, 4:3, 3:4, 16:9, 9:16, 3:2, 2:3 or e.g. 1024x768
  # megapixels: 1.0        # resolution: 0.5 fast · 1 standard · 1.5 fine · 2 large (slower, more VRAM)
  # unload_llm: auto       # take the language model out of VRAM while painting: auto (below 16 GB) | always | never
  # idle_minutes: 10       # unload the image model after this long without a new image
  # extra_args: ""         # own sd-server options (replaces the automatic --offload-to-cpu/--clip-on-cpu/--vae-tiling)
  # startup_timeout: 600

ssh:                       # other computers (NAS, server) via SSH – user name and password are asked in the dashboard
  hosts: {}                # short names, e.g. {nas: {host: 192.168.1.10, user: admin}} (port: 22) – any address works too
  # keep_minutes: 15       # a connection stays open this long after the last command, then the password is asked again
  # connect_timeout: 15    # seconds to wait for the device to answer

mail:                      # e-mail via IMAP – Proton Mail through the local Proton Mail Bridge (paid plan)
  host: 127.0.0.1          # Bridge defaults; any other IMAP server works too (then e.g. port 993, security: ssl)
  port: 1143
  security: starttls       # starttls | ssl | none
  username: ""             # e.g. you@proton.me – leave empty to disable
  password: ""             # Proton: the BRIDGE password shown in the Bridge app (or $ORBWISE_MAIL_PASSWORD)
  # verify_ssl: false      # default: not checked on localhost (Bridge certificate), checked everywhere else
  # timeout: 30
  # max_chars: 6000        # longest mail text passed to the model
  archive_folder: Archive
  trash_folder: Trash
  send_enabled: false      # true = Orbwise may draft and send mails – always via a dialog to edit To/Subject/Text
  # smtp_host: ""          # empty = same as host; Proton Mail Bridge: SMTP 127.0.0.1:1025 with STARTTLS
  # smtp_port: 1025
  # smtp_security: starttls
  # from_address: ""       # empty = username

telegram:                  # optional: chat from the phone, reminders on the phone, confirm via buttons
  token: ""                # from @BotFather (/newbot) – or $ORBWISE_TELEGRAM_TOKEN
  chat_id: 0               # the bot tells you this after "/start"; only this chat is served
  # inbox_dir: ~/Downloads/Orbwise-Telegram   # files/photos you send the bot are saved here

vision:                    # understand the screen and images ("what's that error message?") – runs locally
  enabled: true
  model: qwen2.5vl:7b      # once: ollama pull qwen2.5vl:7b · little VRAM: qwen2.5vl:3b or gemma3:4b
  # backend: ollama        # ollama | openai (OpenAI-compatible server with image support)
  # base_url: ""           # empty = the Ollama address from the llm block
  # api_key: ""            # only for an openai server with --api-key
  # keep_alive: 2m         # unload the vision model again after this long
  # timeout: 180
  # screenshot_command: "" # empty = automatic (spectacle, gnome-screenshot, grim, maim, …); {file} = target file

weather:
  location: ""             # default place for weather and the morning briefing, e.g. "Berlin"

briefing:                  # "good morning" – also adjustable in the dashboard (PLANNER tab → BRIEFING CONTENT)
  sections: [weather, calendar, reminders, mail, paperless_inbox, news, updates, storage]   # order as listed
  lookahead_days: 2        # events + reminders/deadlines for today and the next days (0 = today only)
  news_topics: []          # e.g. [Linux, Berlin] – headlines of the last 24 h
  news_count: 3            # headlines per topic
  inbox_tag: ""            # Paperless inbox tag – empty = the inbox tags defined in Paperless
  instructions: ""         # e.g. "Keep it short and start with my appointments."

websites: {}               # your own shortcuts for "open …", e.g.:
#  nas: http://192.168.1.10:5000
#  proxmox: https://pve.local:8006
#  shop: https://example.com/search?q={q}   # {q} = search term

calendar:                  # iCloud calendar (or any other CalDAV server: Nextcloud, Radicale, …)
  url: ""                  # iCloud: https://caldav.icloud.com
  username: ""             # your Apple ID e-mail address
  password: ""             # an APP-SPECIFIC password (appleid.apple.com → Sign-In and Security)
                           # or use the environment variable ORBWISE_CALENDAR_PASSWORD instead
  calendars: []            # which calendars to read (empty = all)
  default_calendar: ""     # where new events go (empty = the first one)
  # timeout: 20
