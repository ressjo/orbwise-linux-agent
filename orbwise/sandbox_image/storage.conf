# Image-Speicher von builder: overlay über fuse-overlayfs (/dev/fuse), sonst vfs (STORAGE_DRIVER aus dem Shim).
# Ohne newuidmap (no-new-privileges) gibt es nur eine UID – fremde Besitzer in Images werden ignoriert.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
ignore_chown_errors = "true"

[storage.options.vfs]
ignore_chown_errors = "true"
