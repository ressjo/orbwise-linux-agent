name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra voice
      - name: Lint
        run: uv run ruff check orbwise tests
      - name: Test
        run: uv run pytest -q -n auto
      - name: Version and changelog agree
        run: |
          version=$(grep -m1 '^__version__' orbwise/__init__.py | cut -d'"' -f2)
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section [$version] for orbwise/__init__.py"; exit 1; }
          uv build --wheel -q -o /tmp/dist && ls /tmp/dist/orbwise-$version-*.whl
      - name: Installer syntax
        run: bash -n scripts/install.sh && bash -n scripts/bootstrap.sh && bash -n scripts/orbwise-launcher
